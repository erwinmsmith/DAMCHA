site_name: DAMCHA
site_description: Data-Adaptive Mahalanobis Cross-Head Attention. Accepted at NeurIPS 2026.
site_url: https://erwinmsmith.github.io/DAMCHA/
repo_url: https://github.com/erwinmsmith/DAMCHA
repo_name: erwinmsmith/DAMCHA
edit_uri: edit/main/docs/
strict: true
theme:
  name: mkdocs
  color_mode: light
  user_color_mode_toggle: true
  nav_style: light
nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Method: method.md
  - Experiments: experiments.md
  - Citation: citation.md
markdown_extensions:
  - fenced_code
  - tables
  - admonition
extra_css:
  - stylesheets/extra.css
